<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ZOOM13 战术背景图总览</title>
<style>
  :root{--bg:#14120f;--panel:#1e1b16;--line:#3a332a;--fg:#e8e0d2;--dim:#9a917f;--hot:#c9a227}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
  h1{margin:0 0 8px;font-size:15px;letter-spacing:.06em}
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .grp{display:flex;gap:6px;align-items:center}
  .grp b{color:var(--dim);font-weight:400}
  select,button{background:#26221b;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--hot)}
  #stat{color:var(--dim);margin-left:auto}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:14px}
  #grid.c1{grid-template-columns:1fr}
  #grid.c2{grid-template-columns:repeat(2,1fr)}
  #grid.c3{grid-template-columns:repeat(3,1fr)}
  #grid.c4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .card canvas{display:block;width:100%;height:auto;background:#000;cursor:zoom-in}
  /* 删除按钮：压在图左上角，hover 卡片才显形，免得挡住看图 */
  .shot{position:relative}
  .shot .del{position:absolute;top:6px;left:6px;width:26px;height:26px;padding:0;line-height:1;
             font-size:17px;font-weight:700;border-radius:3px;opacity:0;transition:opacity .12s;
             background:#0009;border:1px solid #0000;color:#e8e0d2;cursor:pointer}
  .card:hover .shot .del{opacity:1}
  .shot .del:hover{background:#a33;border-color:#d66;color:#fff}
  .sep{width:1px;height:18px;background:var(--line)}
  .dim{color:var(--dim)}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{border-color:var(--line)}
  /* 单图放大层：点图进，点任意处/ESC 出，← → 翻页 */
  #box{position:fixed;inset:0;z-index:99;background:#000d;display:none;
       flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
  #box.on{display:flex}
  #box img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;
           border:1px solid var(--line);border-radius:4px;image-rendering:auto}
  #boxmeta{background:var(--panel);border:1px solid var(--line);border-radius:4px;
           padding:8px 12px;max-width:min(1400px,96vw);font-size:12px}
  #boxmeta .t{color:var(--hot);font-weight:700}
  #boxmeta .k{color:var(--dim)}
  #boxmeta code{color:#b7c9a0}
  #boxhint{color:var(--dim);font-size:12px}
  .meta{padding:7px 9px;font-size:12px}
  .meta .t{color:var(--hot);font-weight:700}
  .meta .k{color:var(--dim)}
  .meta code{color:#b7c9a0}
  .warn{color:#d98b6a}
</style>
</head>
<body>
<header>
  <h1>ZOOM 13 战术模式 · 战场底图总览（按真实城池）</h1>
  <div class="bar">
    <div class="grp"><b>模式</b><select id="mode">
      <option value="combo" selected>底图×树（去重，每种搭配一张）</option>
      <option value="city">按城池</option>
    </select></div>
    <div class="grp"><b>季节</b><select id="season"><option value="0">春夏</option><option value="1">秋</option><option value="2">冬</option></select></div>
    <div class="grp"><b>战斗</b><select id="siege"><option value="siege" selected>攻防战</option><option value="field">野战</option><option value="all">两者</option></select></div>
    <div class="grp"><b>文化区</b><select id="region"><option value="all">全部</option></select></div>
    <div class="grp"><b>底图</b><select id="base"><option value="all">全部</option></select></div>
    <div class="grp"><b>层级</b><select id="tier"><option value="all">全部</option><option value="0">大城</option><option value="1">中城</option><option value="2">关隘</option><option value="4">周边</option></select></div>
    <div class="grp"><b>张数</b><select id="limit"><option value="24" selected>24</option><option value="60">60</option><option value="150">150</option><option value="0">全部</option></select></div>
    <div class="grp"><b>尺寸</b><select id="size"><option value="960">960×518</option><option value="1280" selected>1280×691</option><option value="1600">1600×864</option><option value="2000">2000×1080（实机）</option></select></div>
    <div class="grp"><b>每行</b><select id="cols"><option value="1">1 张（最大）</option><option value="2" selected>2 张</option><option value="3">3 张</option><option value="4">4 张</option><option value="auto">自动铺满</option></select></div>
    <button id="run">重新生成</button>
    <button id="reseed">换随机种子</button>
    <span class="sep"></span>
    <span id="delstat" class="dim"></span>
    <button id="undel" title="把标记过的据点全部放回来">恢复全部</button>
    <button id="export" title="导出已标记据点清单 JSON">导出清单</button>
    <span id="stat"></span>
  </div>
</header>
<div id="grid" class="c2"></div>
<div id="box">
  <img id="boximg" alt="">
  <div id="boxmeta"></div>
  <div id="boxhint">点任意处或按 ESC 关闭 · ← → 翻上一张/下一张</div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
