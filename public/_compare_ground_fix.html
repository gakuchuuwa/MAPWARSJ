function computeRingWall(baseSize, S) {
  const stepX = baseSize * 0.075, stepY = stepX * 0.58, AX = 2 * S;
  const westX = -AX * stepX, eastX = AX * stepX, northY = -AX * stepY, southY = AX * stepY;
  const pieces = [];

  pieces.push({ x: westX, y: 0, type: 'POST' });
  pieces.push({ x: 0, y: northY, type: 'POST' });
  pieces.push({ x: eastX, y: 0, type: 'POST' });
  pieces.push({ x: 0, y: southY, type: 'POST' });

  // 西北边
  for (let k = 1; k < AX; k++) {
    if (k >= S - 1 && k <= S + 1) continue;
    pieces.push({ x: westX + k * stepX, y: -k * stepY, type: 'NE' });
  }
  pieces.push({ x: westX + S * stepX, y: -S * stepY, type: 'GATE' });

  // 东北边
  for (let k = 1; k < AX; k++) pieces.push({ x: k * stepX, y: northY + k * stepY, type: 'SE' });

  // 东南边
  for (let k = 1; k < AX; k++) {
    if (k >= S - 1 && k <= S + 1) continue;
    pieces.push({ x: eastX - k * stepX, y: k * stepY, type: 'SE', flipX: true });
  }
  pieces.push({ x: eastX - S * stepX, y: S * stepY, type: 'GATE' });

  // 西南边
  for (let k = 1; k < AX; k++) pieces.push({ x: -k * stepX, y: southY - k * stepY, type: 'NE', flipX: true });

  return pieces;
}

function getFortifiedAnchors(style) {
  const m = META[style] && META[style].FORTIFIED ? META[style].FORTIFIED : META['ASIA'].FORTIFIED;
  return {
    NE: { pctX: m.NE.anchor_x / m.NE.box_w * 100, pctY: m.NE.anchor_y / m.NE.box_h * 100, widthFactor: 0.16, path: '/SUCAI_BUILDING/' + m.NE.name + '/preview.png' },
    SE: { pctX: m.SE.anchor_x / m.SE.box_w * 100, pctY: m.SE.anchor_y / m.SE.box_h * 100, widthFactor: 0.16, path: '/SUCAI_BUILDING/' + m.SE.name + '/preview.png' },
    POST: { pctX: m.POST.anchor_x / m.POST.box_w * 100, pctY: m.POST.anchor_y / m.POST.box_h * 100, widthFactor: 0.20, path: '/SUCAI_BUILDING/' + m.POST.name + '/preview.png' },
    GATE: { pctX: m.GATE_NE.anchor_x / m.GATE_NE.box_w * 100, pctY: m.GATE_NE.anchor_y / m.GATE_NE.box_h * 100, widthFactor: 0.34, path: '/SUCAI_BUILDING/' + m.GATE_NE.name + '/preview.png' }
  };
}

// 修复前：旧大城
function renderOldBig(baseSize) {
  const parts = [];
  const AUTO = 1.2;
  const style = 'ASIA';
  const stepX = baseSize * 0.075, stepY = stepX * 0.58;
  const gateRoadW = baseSize * 1.45, gateRoadH = gateRoadW * 0.58;
  parts.push('<img src="/SUCAI_TERRAIN/rd1_plaza.png" style="position:absolute;left:50%;top:50%;width:' + gateRoadW + 'px;height:' + gateRoadH + 'px;transform:translate(calc(-50% - ' + (7*stepX) + 'px),calc(-50% - ' + (7*stepY) + 'px));z-index:96;opacity:0.95;pointer-events:none;" />');
  parts.push('<img src="/SUCAI_TERRAIN/rd1_plaza.png" style="position:absolute;left:50%;top:50%;width:' + gateRoadW + 'px;height:' + gateRoadH + 'px;transform:translate(calc(-50% + ' + (7*stepX) + 'px),calc(-50% + ' + (7*stepY) + 'px));z-index:96;opacity:0.95;pointer-events:none;" />');

  const list = [
    { b: 'TOWN_CENTER', age: 'AGE4', s: 0.45, isCenter: true },
    { b: 'MARKET', age: 'AGE4', s: 0.35, angle: 45, r: 0.42 },
    { b: 'UNIVERSITY', age: 'AGE4', s: 0.35, angle: 90, r: 0.45 },
    { b: 'BARRACKS', age: 'AGE3', s: 0.33, angle: 135, r: 0.40 },
    { b: 'BLACKSMITH', age: 'AGE3', s: 0.32, angle: 180, r: 0.44 },
    { b: 'MONASTERY', age: 'AGE3', s: 0.34, angle: 225, r: 0.41 },
    { b: 'SIEGE_WORKSHOP', age: 'AGE3', s: 0.35, angle: 270, r: 0.43 },
    { b: 'ARCHERY_RANGE', age: 'AGE3', s: 0.33, angle: 315, r: 0.42 },
    { b: 'STABLE', age: 'AGE3', s: 0.34, angle: 0, r: 0.44 }
  ];
  list.forEach(item => {
    const bW = baseSize * item.s * AUTO;
    const gW = bW * 2.2 * 1.7, gH = gW * 0.58;
    if (item.isCenter) {
      parts.push('<img src="/SUCAI_TERRAIN/rd1_plaza.png" style="position:absolute;left:50%;top:50%;width:' + gW + 'px;height:' + gH + 'px;transform:translate(-50%,-50%);z-index:99;opacity:0.92;pointer-events:none;" />');
      parts.push('<img src="/SUCAI_BUILDING/' + style + '_' + item.b + '_' + item.age + '/preview.png" style="position:absolute;left:50%;top:50%;width:' + bW + 'px;transform:translate(-50%,-65%);z-index:100;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45));" />');
    } else {
      const rad = item.angle * Math.PI / 180;
      const x = Math.cos(rad) * item.r * baseSize, y = Math.sin(rad) * item.r * baseSize * 0.58;
      const zIndex = Math.round(100 + y);
      parts.push('<img src="/SUCAI_TERRAIN/rd1_plaza.png" style="position:absolute;left:50%;top:50%;width:' + gW + 'px;height:' + gH + 'px;transform:translate(calc(-50% + ' + x + 'px),calc(-50% + ' + y + 'px));z-index:' + (zIndex-1) + ';opacity:0.92;pointer-events:none;" />');
      parts.push('<img src="/SUCAI_BUILDING/' + style + '_' + item.b + '_' + item.age + '/preview.png" style="position:absolute;left:50%;top:50%;width:' + bW + 'px;transform:translate(calc(-50% + ' + x + 'px),calc(-50% + ' + y + 'px - 15%));z-index:' + zIndex + ';filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45));" />');
    }
  });

  const pieces = computeRingWall(baseSize, 7);
  const anchors = getFortifiedAnchors(style);
  pieces.forEach(w => {
    const a = anchors[w.type];
    const zIndex = Math.round(100 + w.y);
    const pW = baseSize * a.widthFactor * AUTO;
    const pctX = w.flipX ? (100 - a.pctX) : a.pctX;
    const flip = w.flipX ? ' scaleX(-1)' : '';
    parts.push('<img src="' + a.path + '" style="position:absolute;left:50%;top:50%;width:' + pW.toFixed(1) + 'px;transform:translate(calc(-' + pctX.toFixed(1) + '% + ' + w.x.toFixed(1) + 'px),calc(-' + a.pctY.toFixed(1) + '% + ' + w.y.toFixed(1) + 'px))' + flip + ';z-index:' + zIndex + ';filter:drop-shadow(0 2px 3px rgba(0,0,0,0.45));pointer-events:none;" />');
  });
  return parts.join('');
}

    const bW = baseSize * item.s * AUTO;
    if (item.isCenter) {
      parts.push('<img src="/SUCAI_BUILDING/' + style + '_' + item.b + '_' + item.age + '/preview.png" style="position:absolute;left:50%;top:50%;width:' + bW + 'px;transform:translate(-50%,-65%);z-index:100;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45));" />');
    } else {
      const rad = item.angle * Math.PI / 180;
      const x = Math.cos(rad) * item.r * baseSize, y = Math.sin(rad) * item.r * baseSize * 0.58;
      const zIndex = Math.round(100 + y);
      parts.push('<img src="/SUCAI_BUILDING/' + style + '_' + item.b + '_' + item.age + '/preview.png" style="position:absolute;left:50%;top:50%;width:' + bW + 'px;transform:translate(calc(-50% + ' + x + 'px),calc(-50% + ' + y + 'px - 15%));z-index:' + zIndex + ';filter:drop-shadow(0 2px 4px rgba(0,0,0,0.45));" />');
    }
  });

  // 3. 城墙与双塔闭门（z-index 100+w.y，稳稳压住地基边缘）
  const pieces = computeRingWall(baseSize, 7);
  const anchors = getFortifiedAnchors(style);
  pieces.forEach(w => {
    const a = anchors[w.type];
    const zIndex = Math.round(100 + w.y);
    const pW = baseSize * a.widthFactor * AUTO;
    const pctX = w.flipX ? (100 - a.pctX) : a.pctX;
    const flip = w.flipX ? ' scaleX(-1)' : '';
    parts.push('<img src="' + a.path + '" style="position:absolute;left:50%;top:50%;width:' + pW.toFixed(1) + 'px;transform:translate(calc(-' + pctX.toFixed(1) + '% + ' + w.x.toFixed(1) + 'px),calc(-' + a.pctY.toFixed(1) + '% + ' + w.y.toFixed(1) + 'px))' + flip + ';z-index:' + zIndex + ';filter:drop-shadow(0 2px 3px rgba(0,0,0,0.45));pointer-events:none;" />');
  });
  return parts.join('');
}

document.getElementById('stageOld').innerHTML = renderOldBig(170);
document.getElementById('stageNew').innerHTML = renderNewBig(170);
</script>
