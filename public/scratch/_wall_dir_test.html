<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>墙片走向试拼</title>
<style>
 body { margin:0; background:#0d1219; color:#e2e8f0; font:13px/1.6 sans-serif; }
 .row { position:relative; height:230px; border-bottom:1px solid #233044; }
 .row h3 { position:absolute; left:10px; top:6px; margin:0; font-size:13px; color:#63b3ed; }
 .pt { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border:1px dashed #f6e05e; border-radius:50%; }
 img.pc { position:absolute; left:0; top:0; pointer-events:none; }
</style></head>
<body>
<div id="out"></div>
<script>
const W = 99;                                   // = 0.165(素材宽度权重) × 100(基准) × 6(放大)：真实比例，不是随手填的
const CASES = [
  ['① NE 片 · 沿 (1,-1) 斜步（设计里 NE 的定义，已知能拼）', 'HARDWOOD_WALL_PALISADE_NE', 45, -26.1],
  ['② NE 片 · 沿 (1,0) 横步（曲线形制实际用的步）', 'HARDWOOD_WALL_PALISADE_NE', 45, 0],
  ['③ N 片 · 沿 (1,-1) 斜步', 'HARDWOOD_WALL_PALISADE_N', 45, -26.1],
  ['④ N 片 · 沿 (-1,-1) 斜步（NE 的镜像方向）', 'HARDWOOD_WALL_PALISADE_N', -45, -26.1],
  ['⑤ N 片 · 沿 (1,0) 横步', 'HARDWOOD_WALL_PALISADE_N', 45, 0],
  ['⑥ N 片 · 沿 (0,1) 竖步', 'HARDWOOD_WALL_PALISADE_N', 0, 26.1],
  ['⑦ SE 片 · 沿 (1,1) 斜步（设计里 SE 的定义，已知能拼）', 'HARDWOOD_WALL_PALISADE_SE', 45, 26.1],
  ['⑧ NE 片 · 沿 (0,1) 竖步', 'HARDWOOD_WALL_PALISADE_NE', 0, 26.1],
];
document.getElementById('out').innerHTML = CASES.map(([title, name, dx, dy]) => `<div class="row">
  <h3>${title}　（步长 ${dx}, ${dy} px）</h3>
  ${[...Array(6)].map((_, k) => {
    const x = 120 + k * dx, y = 120 + k * dy;
    return `<div class="pt" style="left:${x}px;top:${y}px"></div>`
      + `<img class="pc" src="/SUCAI_BUILDING/${name}/preview.png" style="width:${W}px;`
      + `transform:translate(calc(${x}px - 50%), calc(${y}px - 78%))">`;
  }).join('')}
</div>`).join('');
</script>
</body></html>
