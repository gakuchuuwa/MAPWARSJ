<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MAPWAR ZOOM13 多地貌咬合 POC</title>
<style>
  html,body{margin:0;background:#1a1a1a;font-family:sans-serif;color:#eee}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:16px}
  h2{font-size:15px;margin:4px 0 8px;color:#aaa}
  canvas{image-rendering:pixelated;border:1px solid #444;max-width:100%}
  .bar{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
  button{background:#333;color:#fff;border:1px solid #555;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px}
  button:hover{background:#444}
  label{font-size:12px;color:#aaa}
  select{background:#333;color:#eee;border:1px solid #555;padding:4px}
</style>
</head>
<body>
<div id="wrap">
  <h2>ZOOM13 多地貌咬合 + 边缘过渡 POC（等距菱形 64×32，DE 官方 SUCAI_TERRAIN 贴图）</h2>
  <div class="bar">
    <label>地貌组合：
      <select id="scenario">
        <option value="grass_mud">温带草地+泥地+滩涂+树林（无河道）</option>
        <option value="river">大江渡口+滩涂+农田+树林（有河道）</option>
        <option value="winter">冬季雪原+露土+冻土+砾石+树林</option>
        <option value="desert">荒漠+砾石+干裂+沙地</option>
      </select>
    </label>
    <button id="reroll">换一张（换种子）</button>
    <label><input type="checkbox" id="blend" checked> 边缘羽化过渡</label>
    <label><input type="checkbox" id="noise" checked> 噪声扰边（DE 咬合感）</label>
  </div>
  <canvas id="cv" width="1000" height="700"></canvas>
  <div class="bar">
    <button id="snap">保存截图</button>
  </div>
</div>
<script>
// ── 参考 Scene13EnvironmentGenerator 的等距网格函数 ─────────────
const TILE_W = 64, TILE_H = 32;
function setupIsoGrid(VW, VH){
  const H = Math.ceil(VW/2 + VH) + TILE_H;
  const sum = Math.ceil(H/(TILE_H/2));
  const gw = Math.ceil(sum/2), gh = sum - gw;
  const ox = VW/2, oy = (VH - (gw+gh)*(TILE_H/2))/2;
  return {gw,gh,ox,oy};
}
function isoCellX(gx,gy,ox){return (gx-gy)*(TILE_W/2)+ox}
function isoCellY(gx,gy,oy){return (gx+gy)*(TILE_H/2)+oy}
function screenToGrid(x,y,ox,oy){
  const a=(x-ox)*2/TILE_W, b=(y-oy)*2/TILE_H;
  return [Math.round((a+b)/2), Math.round((b-a)/2)];
}

// 确定性随机
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return h>>>0}

// 贴图缓存
const TEX = {};
const BASE = 'SUCAI_TERRAIN/';
const terrainTiles = ['grs','gr3','gr2','gr7','ds3','sno','bch','sh4','sh5','rc1','gravel_default','for','rd1'];
const images = {};
function loadAll(cb){
  let loaded=0;
  const total=terrainTiles.length;
  terrainTiles.forEach(t=>{
    const im=new Image();
    im.onload=()=>{images[t]={img:im,complete:true,naturalWidth:im.naturalWidth};loaded++;if(loaded>=total)cb()};
    im.onerror=()=>{images[t]={img:null,complete:true,naturalWidth:0};loaded++;if(loaded>=total)cb()};
    im.src=BASE+t+'.png';
  });
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const VW=cv.width, VH=cv.height;
const grid=setupIsoGrid(VW,VH);
const {gw,gh,ox,oy}=grid;

// 场景定义：每个地貌 = tile 名 + 数量/尺寸/alpha
const SCENARIOS = {
  grass_mud:{
    base:'grs',
    patches:[
      {tile:'gr3', count:7, size:[5,8], alpha:0.55},
      {tile:'gr2', count:6, size:[5,8], alpha:0.5},
      {tile:'gr7', count:5, size:[5,7], alpha:0.5},
      {tile:'ds3', count:4, size:[3,5], alpha:0.55},
      {tile:'bch', count:3, size:[4,6], alpha:0.6},
      {tile:'for', count:4, size:[3,6], alpha:0.65},
      {tile:'gravel_default', count:2, size:[3,4], alpha:0.5},
    ],
  },
  river:{
    base:'gr3',
    patches:[
      {tile:'grs', count:6, size:[5,8], alpha:0.5},
      {tile:'gr2', count:5, size:[5,8], alpha:0.5},
      {tile:'bch', count:4, size:[4,6], alpha:0.62},
      {tile:'sh4', count:3, size:[4,7], alpha:0.7},
      {tile:'rd1', count:2, size:[3,5], alpha:0.55},
      {tile:'for', count:5, size:[3,6], alpha:0.65},
    ],
  },
  winter:{
    base:'sno',
    patches:[
      {tile:'grs', count:4, size:[4,7], alpha:0.5},
      {tile:'ds3', count:4, size:[3,6], alpha:0.55},
      {tile:'gravel_default', count:3, size:[3,5], alpha:0.5},
      {tile:'gr3', count:4, size:[3,5], alpha:0.45},
      {tile:'for', count:4, size:[3,6], alpha:0.6},
    ],
  },
  desert:{
    base:'snd',
    patches:[
      {tile:'pal', count:4, size:[4,7], alpha:0.5},
      {tile:'rc1', count:5, size:[3,5], alpha:0.55},
      {tile:'gravel_default', count:3, size:[3,5], alpha:0.5},
      {tile:'ds3', count:4, size:[4,6], alpha:0.55},
      {tile:'for', count:2, size:[2,4], alpha:0.6},
    ],
  },
};

// 随机斑块细胞
function growClump(sx,sy,target,gw,gh,rng){
  const occ=new Set();const cells=[[sx,sy]];const frontier=[[sx,sy]];occ.add(sx+','+sy);
  while(cells.length<target&&frontier.length){
    const fi=rng()*frontier.length|0;
    const [cx,cy]=frontier[fi];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=3;i>0;i--){const j=rng()*(i+1)|0;const t=dirs[i];dirs[i]=dirs[j];dirs[j]=t}
    let grown=false;
    for(const[dxx,dyy]of dirs){
      const nx=cx+dxx,ny=cy+dyy;
      if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
      const k=nx+','+ny;if(occ.has(k))continue;
      occ.add(k);cells.push([nx,ny]);frontier.push([nx,ny]);grown=true;break;
    }
    if(!grown)frontier.splice(fi,1);
  }
  return cells;
}

function render(seed, useBlend, useNoise){
  const sc=SCENARIOS[document.getElementById('scenario').value];
  const rng=mulberry32(hashStr(seed));
  ctx.clearRect(0,0,VW,VH);
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);

  // 1. 基底铺满
  const base=images[sc.base];
  if(base&&base.complete){
    const pat=ctx.createPattern(base.img,'repeat');
    ctx.fillStyle=pat;ctx.fillRect(0,0,VW,VH);
  }

  // 2. 斑块
  const cellPoints=[];
  for(const p of sc.patches){
    const n=p.count;
    for(let i=0;i<n;i++){
      const sx=1+rng()*(gw-2)|0, sy=1+rng()*(gh-2)|0;
      const size=p.size[0]+rng()*(p.size[1]-p.size[0])|0;
      const cells=growClump(sx,sy,size,gw,gh,rng);
      const img=images[p.tile];
      if(!img||!img.complete)continue;
      // 屏幕坐标点
      const pts=cells.map(([gx,gy])=>({x:isoCellX(gx,gy,ox),y:isoCellY(gx,gy,oy)}));
      cellPoints.push({tile:p.tile,pts,alpha:p.alpha,img});
    }
  }

  // 3. 每个斑块：软边多边形（+可选噪声扰边）
  for(const c of cellPoints){
    ctx.save();
    ctx.globalAlpha=c.alpha;
    ctx.beginPath();
    drawSoftPolygon(ctx,c.pts,useNoise?4:0,rng);
    ctx.closePath();
    ctx.clip();
    const pat=ctx.createPattern(c.img.img,'repeat');
    ctx.fillStyle=pat;
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }

  // 4. 全屏叠加一层淡噪声明暗（打破平铺）
  if(useNoise){
    const g2=ctx.createRadialGradient(VW/2,VH/2,VH*0.2,VW/2,VH/2,VH*0.8);
    g2.addColorStop(0,'rgba(255,255,255,0.05)');
    g2.addColorStop(1,'rgba(0,0,0,0.10)');
    ctx.fillStyle=g2;ctx.fillRect(0,0,VW,VH);
  }
}

function drawSoftPolygon(ctx,pts,noise,rng){
  // 用运动边界生成不规则有机多边形
  const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length;
  const cy=pts.reduce((a,p)=>a+p.y,0)/pts.length;
  let maxR=0;for(const p of pts){const d=Math.hypot(p.x-cx,p.y-cy);if(d>maxR)maxR=d}
  const seg=Math.max(24,pts.length*2);
  for(let i=0;i<=seg;i++){
    const a=(i/seg)*Math.PI*2;
    let r=maxR*0.92;
    if(noise){
      r*=0.82+0.36*mulberry32((rng()*1e9)|0)();
    }
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r*0.5;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
}

// 事件
document.getElementById('reroll').onclick=()=>render(Math.random()+'',document.getElementById('blend').checked,document.getElementById('noise').checked);
document.getElementById('blend').onchange=()=>render('poc',document.getElementById('blend').checked,document.getElementById('noise').checked);
document.getElementById('noise').onchange=()=>render('poc',document.getElementById('blend').checked,document.getElementById('noise').checked);
document.getElementById('scenario').onchange=()=>render('poc',document.getElementById('blend').checked,document.getElementById('noise').checked);
document.getElementById('snap').onclick=()=>{
  const a=document.createElement('a');
  a.download='poc_terrain_'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png');
  a.click();
};

loadAll(()=>{
  document.getElementById('reroll').disabled=false;
  render('poc',true,true);
});
document.getElementById('reroll').disabled=true;
</script>
</body>
</html>
