<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>stone wall geometry</title>
<style>body{background:#181b20;color:#ddd;font-family:monospace;margin:20px}</style>
</head>
<body>
<canvas id="cv" width="560" height="480" style="background:#101216"></canvas>
<div style="color:#888;font-size:12px;white-space:pre" id="log"></div>
<script>
const baseSize=120, AUTO=1.1;
// 素材比例 (h/w) 用 box 尺寸
const BOX={NE:[99,91],SE:[100,93],POST:[157,173],GATE:[301,245]};
// DE_STONE_ANCHORS（当前状态：GATE pctY 79.8 wf 0.42）
const ANCHORS={
  NE:{pctX:60.6,pctY:78.0,wf:0.20},
  SE:{pctX:61.0,pctY:78.5,wf:0.20},
  POST:{pctX:66.9,pctY:84.4,wf:0.33},
  GATE:{pctX:58.8,pctY:79.8,wf:0.42},
};
function pieces(){
  const stepX=baseSize*0.075, stepY=stepX*0.58, S=5, AX=2*S;
  const westX=-AX*stepX, eastX=AX*stepX, northY=-AX*stepY, southY=AX*stepY;
  const out=[];
  out.push({x:westX,y:0,type:'POST'}); out.push({x:0,y:northY,type:'POST'});
  out.push({x:eastX,y:0,type:'POST'}); out.push({x:0,y:southY,type:'POST'});
  for(let k=1;k<AX;k++){ if(k>=4&&k<=6)continue; out.push({x:westX+k*stepX,y:-k*stepY,type:'NE'}); }
  out.push({x:westX+5*stepX,y:-5*stepY,type:'GATE'});
  for(let k=1;k<AX;k++) out.push({x:k*stepX,y:northY+k*stepY,type:'SE'});
  for(let k=1;k<AX;k++){ if(k>=4&&k<=6)continue; out.push({x:eastX-k*stepX,y:k*stepY,type:'SE',flipX:true}); }
  out.push({x:eastX-5*stepX,y:5*stepY,type:'GATE'});
  for(let k=1;k<AX;k++) out.push({x:-k*stepX,y:southY-k*stepY,type:'NE',flipX:true});
  return out;
}
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const cx=cv.width/2, cy=cv.height/2;
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const COL={NE:'#4c9bb0',SE:'#4c9bb0',POST:'#e0a32e',GATE:'#d25b5b'};
  let lines=[];
  const ps=pieces();
  lines.push('pieceW = baseSize*wf*AUTO ('+baseSize+' * '+AUTO+')');
  for(const w of ps){
    const a=ANCHORS[w.type];
    const pieceW=baseSize*a.wf*AUTO;
    const [bw,bh]=BOX[w.type];
    const pieceH=pieceW*(bh/bw);
    const pctX=w.flipX?(100-a.pctX):a.pctX;
    const imgLeft=cx - pctX/100*pieceW + w.x;
    const imgTop=cy - a.pctY/100*pieceH + w.y;
    ctx.fillStyle=COL[w.type]; ctx.globalAlpha=0.7;
    ctx.fillRect(imgLeft, imgTop, pieceW, pieceH);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.globalAlpha=0.9;
    ctx.strokeRect(imgLeft,imgTop,pieceW,pieceH);
    ctx.globalAlpha=1;
    ctx.font='9px monospace'; ctx.fillStyle='#111';
    ctx.fillText(w.type, imgLeft+2, imgTop+9);
    if(w.type==='GATE') lines.push(`GATE flip=${!!w.flipX} left=${imgLeft.toFixed(0)} top=${imgTop.toFixed(0)} w=${pieceW.toFixed(0)} h=${pieceH.toFixed(0)}`);
  }
  lines.push('center=('+cx+','+cy+')');
  // 画中心十字
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(cx-8,cy); ctx.lineTo(cx+8,cy); ctx.moveTo(cx,cy-8); ctx.lineTo(cx,cy+8); ctx.stroke();
  document.getElementById('log').textContent=lines.join('\n');
}
draw();
</script>
</body>
</html>
